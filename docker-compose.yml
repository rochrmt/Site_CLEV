# ============================================================
#  CLEV-Beauty-Demo — Site PHP avec Nginx + PHP-FPM + Traefik
#  Emplacement : /opt/clev-beauty-demo
#  Usage : docker compose up -d --build
#  Accès : https://clev-beauty-demo.mbila.pro (SSL automatique)
# ============================================================

services:
  php:
    build: .
    container_name: clev-beauty-php
    restart: unless-stopped
    networks:
      - clev-internal

  nginx:
    image: nginx:alpine
    container_name: clev-beauty-demo
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on:
      - php
    networks:
      - clev-internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clev-beauty-demo.rule=Host(`clev-beauty-demo.mbila.pro`)"
      - "traefik.http.routers.clev-beauty-demo.entrypoints=websecure"
      - "traefik.http.routers.clev-beauty-demo.tls.certresolver=letsencrypt"
      - "traefik.http.services.clev-beauty-demo.loadbalancer.server.port=80"
      - "traefik.http.routers.clev-beauty-demo.middlewares=gzip@file,security-headers@file"

networks:
  clev-internal:
  traefik-proxy:
    external: true
